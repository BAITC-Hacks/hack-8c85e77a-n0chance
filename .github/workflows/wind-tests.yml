name: WIND checks
on:
  push:
    paths: ['wind-forecast/**', '.github/workflows/wind-tests.yml']
  pull_request:
    paths: ['wind-forecast/**', '.github/workflows/wind-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wind-forecast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wind-forecast/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
